[project]
name = "illumineers-digest"
version = "0.1.0"
description = "Weekly and on-demand Disney Lorcana news digest, summarized by Claude."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.116",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
digest = "digest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digest"]
