# Which sources the digest pulls from and how far back it looks.

site:
  title: Illumineers Digest
  # Public URL where site/ is served. Used for links in the RSS feed.
  base_url: https://clesiemo3.com/illumineers-digest

window:
  # News, Reddit, Bluesky, YouTube and inbox items from the last N days.
  days: 7
  # Lorcanahunter publishes decklists a week or two after events, so
  # tournaments use a longer window.
  tournament_days: 14

tournaments:
  # Lorcanahunter: podium players and ink colors, which feed the ink-pair and
  # player tables. Turned off in favor of the inkdecks feed below; set true to
  # bring the tables back. Only events with published decklists are listed,
  # 25 per page.
  lorcanahunter: false
  max_pages: 4
  min_players: 16
  # inkdecks' event feed: titles, descriptions and links only (allowed by the
  # site owner; no decklists). Cloudflare blocks scripts from it, so when the
  # live fetch fails, the copy saved from your browser at saved_file is used.
  inkdecks:
    enabled: true
    url: https://inkdecks.com/lorcana-tournaments/feed.rss
    saved_file: inkdecks.rss

reddit:
  subreddits: [Lorcana]
  limit: 25

web_search:
  enabled: true
  max_searches: 8
  # Sites Claude should check for news. It may still search more broadly.
  focus:
    - disneylorcana.com
    - ravensburger.com
    - lorcanaplayer.com
    - dotesports.com
    - si.com/esports/lorcana
    - x.com (major stories only)

claude:
  # claude-code: runs through the Claude Code CLI on your Claude subscription.
  # api: uses the Anthropic API with ANTHROPIC_API_KEY, billed per token.
  backend: claude-code
  # Model for the api backend.
  model: claude-opus-5-5
  # Model for the claude-code backend: an alias such as opus or sonnet, or
  # blank to use your plan's default.
  claude_code_model: ""
