# People and outlets worth tracking. Add a line per account.
#
# role: competitive | pro_player | creator | official | news
#   Posts from competitive, pro_player and official accounts are flagged as
#   higher priority when Claude writes the digest.
# bluesky: handle without the @ (e.g. someone.bsky.social). Read every run.
# youtube_channel_id: the UC... id (find it in the page source of the
#    channel's @handle page as "externalId"). Read every run via RSS.
# x: handle without the @. Not fetched (no X API); Claude's web search uses
#    these names to recognize notable X posts.
#
# Leave a field out if the account isn't on that platform.

